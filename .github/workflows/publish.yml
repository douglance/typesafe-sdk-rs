name: Bootstrap npm

on:
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack and verify only; disable to publish the placeholder to npm'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'typesafe-ai/typesafe-sdk-js'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm install --global npm@11.19.0
      - name: Pack placeholder and verify contents
        run: |
          npm pack --json > "$RUNNER_TEMP/bootstrap-pack.json"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(pkg.name, '@typesafe-ai/sdk');
          assert.equal(pkg.version, '0.0.0-bootstrap.0');
          assert.equal(pkg.repository.url, 'git+https://github.com/typesafe-ai/typesafe-sdk-js.git');
          assert.equal(pkg.publishConfig.access, 'public');
          assert.equal(pkg.publishConfig.tag, 'bootstrap');
          assert.equal(pkg.publishConfig.provenance, true);
          assert.equal(pkg.scripts, undefined);
          assert.equal(pkg.dependencies, undefined);
          const [packed] = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/bootstrap-pack.json`, 'utf8'));
          assert.equal(packed.filename, 'typesafe-ai-sdk-0.0.0-bootstrap.0.tgz');
          assert.deepEqual(packed.files.map(file => file.path).sort(), ['LICENSE', 'README.md', 'package.json']);
          console.log(`Verified ${packed.filename}: README, license, and package metadata only.`);
          JS
      - name: Upload reviewed package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-bootstrap
          path: typesafe-ai-sdk-0.0.0-bootstrap.0.tgz
          if-no-files-found: error
      - name: Summarize package check
        run: echo 'Placeholder packed and verified. Download npm-bootstrap to inspect it. This check does not publish to npm.' >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: check
    if: github.event_name == 'workflow_dispatch' && !inputs.dry_run && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.19.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-bootstrap
      - name: Publish placeholder to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish typesafe-ai-sdk-0.0.0-bootstrap.0.tgz --access public --tag bootstrap --provenance
